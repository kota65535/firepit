[tools]
"node" = "24.21.0"
"github:axodotdev/cargo-dist" = "0.33.0"
"github:orhun/git-cliff" = "v2.14.2"
"github:crate-ci/cargo-release" = "v1.1.6"
"lefthook" = "2.1.17"
"dprint" = "0.57.4"
"npm:@commitlint/cli" = "21.2.3"
"github:gitleaks/gitleaks" = "8.30.1"

[settings]
# Pin resolved tool versions (with checksums) in mise.lock so every
# environment installs the exact same artifacts.
lockfile = true
# Tools wait out a 7-day cooldown before a freshly published version
# (and, for npm, its transitive deps) is installed — a supply-chain guard.
minimum_release_age = "7d"

[hooks]
# Install the git hooks right after `mise install` so contributors don't have
# to remember to run `lefthook install` manually.
postinstall = "lefthook install"

[tasks.release]
description = "Cut a release with cargo-release; a dry run unless --execute is given"
# main releases a stable version: a pre-release one loses its pre-release part (1.0.0-beta.3 ->
# 1.0.0), any other gets the version git-cliff bumps to from the commits since the last tag.
# Any other branch releases the next pre-release of its kind (1.0.0-beta.1 -> 1.0.0-beta.2), a beta
# if the version is not one. A level or version given first (e.g. `1.0.0`) overrides them.
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $# -gt 0 && "$1" != -* ]]; then
  level="$1"
  shift
else
  version="$(cargo pkgid | sed 's/.*[#@]//')"
  if [[ "$(git branch --show-current)" == main ]]; then
    case "${version}" in
      *-*) level=release ;;
      *) level="$(git cliff --bumped-version)" ;;
    esac
  else
    case "${version}" in
      *-*) level="${version#*-}" level="${level%%.*}" ;;
      *) level=beta ;;
    esac
  fi
fi
cargo release "${level}" "$@"
'''
