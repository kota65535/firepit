vars:
  env: dev

tasks:
  inherit:
    vars:
      env:
    command: echo "{{ env }}"

  cli:
    vars:
      region:
    command: echo "{{ region }}"

  required:
    vars:
      target:
    command: echo "{{ target }}"

  dependent:
    depends_on:
      - task: required
        vars:
          target: prod
    command: echo "dependent"
