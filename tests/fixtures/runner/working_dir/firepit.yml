# Test that a task inherits the working_dir of `defaults` unless it has its own, and that a
# healthcheck joins its working_dir to the task's
defaults:
  - working_dir: workdir

vars:
  inherit:
    command: pwd
  join:
    command: pwd
    working_dir: ../

tasks:
  inherit:
    command: pwd

  join:
    command: pwd
    working_dir: workdir/task

  service_inherit:
    command: sleep 10
    service:
      healthcheck:
        command: '[ $(cat probe.txt) == "inherit" ]'
        interval: 1
        timeout: 1
        retries: 0

  service_join:
    command: sleep 10
    working_dir: workdir/task
    service:
      healthcheck:
        command: '[ $(cat probe.txt) == "join" ]'
        working_dir: probe
        interval: 1
        timeout: 1
        retries: 0
