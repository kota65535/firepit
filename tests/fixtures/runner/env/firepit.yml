# Base env
includes:
  - base.yml

defaults:
  # Appended to the env_files of base.yml
  - env_files:
      - .env.2
    env:
      key3: pj3

tasks:
  # Test the precedence of env vars:
  #
  # key0: from OS
  # key1: defaults env file .env.1
  # key2: defaults env file .env.2
  # key3: defaults env
  # key4: task env file .env.4
  # key5: task env file .env.5
  # key6: task env
  foo:
    env_files:
      - .env.5
    env:
      key6: task6
    command: echo "${key0} ${key1} ${key2} ${key3} ${key4} ${key5} ${key6}"
