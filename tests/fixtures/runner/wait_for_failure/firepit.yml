# `lint` fails, but `format` only waits for it — it does not depend on it — so `format` still
# runs. A `depends_on` here would have skipped `format` with BadDeps instead.
# Under fail-fast the run is meant to stop on the first failure, so there `format` is skipped;
# both modes are covered by the tests.
tasks:
  lint:
    command: |
      echo "lint"
      exit 3

  format:
    command: echo "format"
    wait_for:
      - lint
