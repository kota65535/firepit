# Typed vars: `type` follows JSON Schema, `default` is optional (omitted = required)
vars:
  version:
    type: string
    default: "1.10"
  count:
    type: integer
    default: 1
  ratio:
    type: number
    default: 0.5
  flag:
    type: boolean
    default: true
  list:
    type: array
    default: [a, "{{ version }}"]
  map:
    type: object
    default:
      a: 1
      b: "{{ count }}"
  # Dynamic vars can be typed as well: the command output is interpreted as the declared type
  dyn_string:
    type: string
    command: echo "1e10"
  dyn_array:
    type: array
    command: printf '[a, b]'

tasks:
  # `type: string` keeps the value as a string, even if it looks like a number
  version:
    command: |
      echo "{{ version }}"
      echo "{% if version is string %}ok{% endif %}"

  count:
    command: |
      echo "{{ count }}"
      echo "{% if count is number %}ok{% endif %}"

  ratio:
    command: |
      echo "{{ ratio }}"

  flag:
    command: |
      echo "{% if flag %}on{% else %}off{% endif %}"

  list:
    command: |
      echo "{{ list[0] }},{{ list[1] }}"
      echo "{% if list is iterable %}ok{% endif %}"

  map:
    command: |
      echo "{{ map['a'] }},{{ map['b'] }}"
      echo "{% if map is object %}ok{% endif %}"

  # Required typed var: set by the CLI or by `depends_on.vars`
  required:
    vars:
      target:
        type: array
    command: echo "{{ target | quote }}"

  dependent:
    depends_on:
      - task: required
        vars:
          target: "[x, y z]"
    command: echo "dependent"

  bad:
    vars:
      port:
        type: integer
    command: echo "{{ port }}"

  dyn_string:
    command: |
      echo "{{ dyn_string }}"
      echo "{% if dyn_string is string %}ok{% endif %}"

  dyn_array:
    command: |
      echo "{{ dyn_array[0] }},{{ dyn_array[1] }}"
      echo "{% if dyn_array is iterable %}ok{% endif %}"
