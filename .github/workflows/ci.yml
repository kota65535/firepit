name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` so a PR-title change is re-checked by the lint job.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so gitleaks can scan past commits.
          fetch-depth: 0

      - name: Install Rust
        # Channel and components both come from rust-toolchain.toml, so bumping
        # that file needs no workflow change.
        run: rustup toolchain install

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install tools (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Format (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Format (dprint)
        run: mise exec -- dprint check

      - name: Pinned tool versions (no "latest")
        run: |
          if grep -nE "=[[:space:]]*['\"]latest['\"]" mise.toml; then
            echo "Pin the tool version in mise.toml; 'latest' is not allowed."
            exit 1
          fi

      - name: Secret scan (gitleaks)
        run: mise exec -- gitleaks git --no-banner --redact

      - name: Conventional PR title (commitlint)
        if: github.event_name == 'pull_request'
        env:
          # Pass via env, never inline, to avoid shell injection.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | mise exec -- commitlint

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Netcat (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y netcat-openbsd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        run: cargo test --all --locked
